name: Build Arabic extensions repo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/ar/**"
      - "core/**"
      - "lib-multisrc/**"
      - "gradle/**"
      - "common/**"
      - "compiler/**"
      - ".github/workflows/build_ar_repo.yml"
      - ".github/scripts/make_ar_repo.py"

permissions:
  contents: write

jobs:
  build:
    name: Build src/ar extensions and publish repo branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Bump version codes so Tachimanga offers updates on every build
        run: |
          python3 - <<'EOF'
          import re, os, glob
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          bumped = 0
          for f in glob.glob('src/ar/*/build.gradle.kts'):
              s = open(f, encoding='utf-8').read()
              s2 = re.sub(r'versionCode = (\d+)', lambda m: f'versionCode = {int(m.group(1)) + run * 1000}', s)
              if s2 != s:
                  open(f, 'w', encoding='utf-8').write(s2)
                  bumped += 1
          print(f'Bumped {bumped} extensions with run number {run}')
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Build Arabic extensions (signed with repo key)
        env:
          ALIAS: discordkey
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS=()
          for dir in src/ar/*/; do
            name=$(basename "$dir")
            TASKS+=(":src:ar:${name}:assembleRelease")
          done
          echo "Building ${#TASKS[@]} modules"
          ./gradlew --continue "${TASKS[@]}" -x spotlessKotlinCheck -x spotlessCheck

      - name: Generate repo files
        run: |
          pip install protobuf
          python .github/scripts/make_ar_repo.py repo-out

      - name: Publish to repo branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b repo
          git add -A
          git commit -q -m "Update Arabic extensions repo"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo:repo
